name: Publish to PyPI

# Trusted Publishing (OIDC): no API tokens are stored in the repo.
# One-time setup and the release checklist live in docs/RELEASING.md.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish (use testpypi for a dry run)"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    name: Build and check distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify release tag matches pyproject version
        if: github.event_name == 'release'
        run: |
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG="${{ github.event.release.tag_name }}"
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "::error::Release tag '$TAG' does not match pyproject version 'v$VERSION'."
            exit 1
          fi

      - name: Build package
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*

      - name: Smoke-test the wheel in a clean venv
        run: |
          python -m venv /tmp/pkg-venv
          /tmp/pkg-venv/bin/pip install dist/*.whl
          cd "$(mktemp -d)"
          /tmp/pkg-venv/bin/loopmark-agent --help

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish:
    name: Publish to ${{ github.event_name == 'release' && 'pypi' || inputs.target }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'release' && 'pypi' || inputs.target }}
    permissions:
      id-token: write

    steps:
      - name: Download distribution
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        if: github.event_name != 'release' && inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: github.event_name == 'release' || inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
