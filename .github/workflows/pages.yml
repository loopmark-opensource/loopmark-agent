name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main, dev]
    paths:
      - "site/**"
      - "scripts/build_docs_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build static docs
        run: python scripts/build_docs_site.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  check-pages:
    name: Check Pages enabled
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Detect GitHub Pages configuration
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          STATUS=$(gh api "repos/${{ github.repository }}/pages" --jq .status 2>/dev/null)
          CODE=$?
          set -e
          if [[ $CODE -eq 0 && -n "$STATUS" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is configured (status: $STATUS)."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages is not enabled. Enable it once: Settings → Pages → Build and deployment → Source: GitHub Actions"
            echo "https://github.com/${{ github.repository }}/settings/pages"
          fi

  deploy:
    name: Deploy to GitHub Pages
    needs: [build, check-pages]
    if: needs.check-pages.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
