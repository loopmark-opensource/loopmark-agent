name: Keep main and dev in sync

# Contributors may target either main or dev. After a merge to main, dev is
# fast-forwarded to match. After a merge to dev, a dev -> main PR is opened
# (main's ruleset requires PRs). Pushes made with GITHUB_TOKEN do not trigger
# workflows, so this cannot loop.

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-branches
  cancel-in-progress: false

jobs:
  sync:
    name: Sync main and dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward dev to main
        if: github.ref_name == 'main' || github.event_name == 'workflow_dispatch'
        run: |
          git fetch origin main dev
          if git merge-base --is-ancestor origin/dev origin/main; then
            git push origin "origin/main:refs/heads/dev"
            echo "dev now matches main ($(git rev-parse --short origin/main))."
          else
            echo "::warning::dev has commits that are not on main; merge the open dev -> main PR to reconcile."
          fi

      - name: Open a dev -> main PR
        if: github.ref_name == 'dev'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main dev
          ahead=$(git rev-list --count origin/main..origin/dev)
          if [[ "$ahead" -eq 0 ]]; then
            echo "dev has nothing new for main."
            exit 0
          fi
          open=$(gh pr list --base main --head dev --state open --json number --jq 'length')
          if [[ "$open" != "0" ]]; then
            echo "A dev -> main PR is already open."
            exit 0
          fi
          gh pr create --base main --head dev \
            --title "Sync dev into main" \
            --body "Automated: dev is $ahead commit(s) ahead of main. Merge to keep both branches up to date." \
            || echo "::warning::Could not open the PR. Enable Settings → Actions → General → 'Allow GitHub Actions to create and approve pull requests', or open it manually."
