name: Close issues on dev merge

# GitHub only honours "Closes #N" when a PR merges into the default branch (main).
# Most contributor PRs merge into dev, so close their linked issues here.
# Never checks out PR code: it only reads the merged PR's description.

on:
  pull_request_target:
    types: [closed]
    branches: [dev]

permissions:
  issues: write

jobs:
  close:
    name: Close linked issues
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Close issues referenced with closing keywords
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const linked = [
              ...new Set(
                [...(pr.body || "").matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s+#(\d+)\b/gi)].map((m) =>
                  Number(m[1])
                )
              ),
            ];

            for (const number of linked) {
              let issue;
              try {
                ({ data: issue } = await github.rest.issues.get({ owner, repo, issue_number: number }));
              } catch {
                core.info(`#${number} not found; skipping.`);
                continue;
              }
              if (issue.pull_request || issue.state === "closed") continue;

              await github.rest.issues.createComment({
                owner, repo, issue_number: number,
                body: `Fixed by #${pr.number} (merged into \`dev\`; it reaches \`main\` with the next dev → main sync). Thanks @${pr.user.login}!`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: number, state: "closed", state_reason: "completed",
              });
            }
