name: Sync branch protection

on:
  workflow_dispatch:

# Rulesets API requires a repo-admin PAT — not available via GITHUB_TOKEN permissions.
permissions:
  contents: read

jobs:
  sync-ruleset:
    name: Apply main branch ruleset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply repository ruleset
        env:
          GH_TOKEN: ${{ secrets.RULESET_ADMIN_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Add repository secret RULESET_ADMIN_TOKEN (PAT with admin:repo) to sync rulesets."
            exit 1
          fi
          RULESET_ID=$(gh api repos/${{ github.repository }}/rulesets --jq '.[] | select(.name=="main") | .id')
          if [[ -z "$RULESET_ID" ]]; then
            gh api \
              --method POST \
              repos/${{ github.repository }}/rulesets \
              --input .github/rulesets/main.json
          else
            gh api \
              --method PUT \
              repos/${{ github.repository }}/rulesets/${RULESET_ID} \
              --input .github/rulesets/main.json
          fi
