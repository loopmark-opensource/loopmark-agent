name: Sync branch protection

on:
  workflow_dispatch:

# Rulesets API requires a repo-admin PAT — not available via GITHUB_TOKEN permissions.
permissions:
  contents: read

jobs:
  sync-ruleset:
    name: Apply main branch ruleset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply repository rulesets (main, dev)
        env:
          GH_TOKEN: ${{ secrets.RULESET_ADMIN_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Add repository secret RULESET_ADMIN_TOKEN (PAT with admin:repo) to sync rulesets."
            exit 1
          fi
          for file in .github/rulesets/*.json; do
            name=$(jq -r .name "$file")
            id=$(gh api "repos/$REPO/rulesets" --jq ".[] | select(.name==\"$name\") | .id")
            if [[ -z "$id" ]]; then
              gh api --method POST "repos/$REPO/rulesets" --input "$file" --jq '"created \(.name) (#\(.id))"'
            else
              gh api --method PUT "repos/$REPO/rulesets/$id" --input "$file" --jq '"updated \(.name) (#\(.id))"'
            fi
          done
