name: CI

on:
  push:
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        env:
          OPENAI_API_KEY: test-key-for-ci
        run: pytest --cov=. --cov-report=term-missing --cov-fail-under=50

  security:
    name: Security scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run security unit tests
        env:
          OPENAI_API_KEY: test-key-for-ci
        run: pytest tests/test_security.py -v

      - name: Run Bandit static analysis
        run: bandit -r agents tools models prompts core credentials config.py main.py scheduler.py -c bandit.yaml -f json -o bandit-report.json

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 14

  vulnerability:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Scan dependencies with pip-audit
        run: python -m pip_audit -r requirements.txt --strict --desc on

  required-checks:
    name: Required checks
    runs-on: ubuntu-latest
    needs: [test, security, vulnerability]
    if: always()

    steps:
      - name: Verify all required CI jobs passed
        run: |
          echo "test: ${{ needs.test.result }}"
          echo "security: ${{ needs.security.result }}"
          echo "vulnerability: ${{ needs.vulnerability.result }}"

          if [[ "${{ needs.test.result }}" != "success" ||
                "${{ needs.security.result }}" != "success" ||
                "${{ needs.vulnerability.result }}" != "success" ]]; then
            echo "One or more required CI checks failed."
            exit 1
          fi

          echo "All required CI checks passed."
