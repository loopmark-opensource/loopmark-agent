[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loopmark-agent"
version = "1.0.0"
description = "Open-source LangGraph AI marketing agent — social content, email campaigns, audience research, lead funnel, and auto-posting."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Loopmark Open Source" },
]
keywords = [
    "marketing",
    "langgraph",
    "langchain",
    "ai-agent",
    "social-media",
    "email-marketing",
    "lead-generation",
    "content-marketing",
    "audience-research",
    "open-source",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "openai>=1.50.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "tweepy>=4.14.0",
    "schedule>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "bandit[toml]>=1.7.0",
    "pip-audit>=2.7.0",
    "build>=1.2.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/loopmark-opensource/loopmark-agent"
Repository = "https://github.com/loopmark-opensource/loopmark-agent"
Issues = "https://github.com/loopmark-opensource/loopmark-agent/issues"
Documentation = "https://github.com/loopmark-opensource/loopmark-agent#readme"

[project.scripts]
loopmark-agent = "main:app"

[tool.setuptools]
py-modules = ["config", "main", "scheduler"]
include-package-data = true

[tool.setuptools.packages.find]
include = [
    "agents*",
    "tools*",
    "models*",
    "prompts*",
    "core*",
    "credentials*",
    "storage*",
]
exclude = ["tests*", "data*", "docs*"]
